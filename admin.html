<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Cornerstone</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 1rem;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--color-text-secondary);
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--color-border);
        }
        th {
            background-color: var(--color-background);
            color: var(--color-text-secondary);
        }
        tr:hover {
            background-color: var(--color-background);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-background);
            color: var(--color-text);
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>Cornerstone Admin</h1>
        <button id="logoutBtn" class="btn btn-outline">Back to App</button>
    </div>

    <div class="admin-container">
        <div class="tabs">
            <button class="tab-btn active" data-target="modules">Modules</button>
            <button class="tab-btn" data-target="access-codes">Access Codes</button>
            <button class="tab-btn" data-target="sessions">Sessions</button>
            <button class="tab-btn" data-target="results">Results</button>
        </div>

        <div id="modules" class="tab-content active">
            <h2>Simulations & Assessments</h2>
            <table id="modulesTable">
                <thead>
                    <tr>
                        <th>Slug</th>
                        <th>Title</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="access-codes" class="tab-content">
            <h2>Access Codes</h2>
            <div style="background: var(--color-background); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem;">
                <h3>Create New Code</h3>
                <form id="createCodeForm">
                    <div class="form-group">
                        <label>Code</label>
                        <input type="text" id="newCode" required placeholder="e.g. VIP-2026">
                    </div>
                    <div class="form-group">
                        <label>Label</label>
                        <input type="text" id="newLabel" placeholder="e.g. VIP Client Access">
                    </div>
                    <div class="form-group">
                        <label>Allowed Modules (comma separated slugs, leave empty for all)</label>
                        <input type="text" id="newModules" placeholder="e.g. leadership-uncertainty, supervisory-skills">
                    </div>
                    <div class="form-group">
                        <label>Expires At (YYYY-MM-DD HH:MM:SS)</label>
                        <input type="text" id="newExpiry" placeholder="Optional">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Access Code</button>
                </form>
            </div>
            
            <table id="accessCodesTable">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Label</th>
                        <th>Status</th>
                        <th>Expiry</th>
                        <th>Uses</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="sessions" class="tab-content">
            <h2>Sessions</h2>
            <table id="sessionsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Token</th>
                        <th>Module</th>
                        <th>Status</th>
                        <th>Access Code</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="results" class="tab-content">
            <h2>Results</h2>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Session Token</th>
                        <th>Module</th>
                        <th>Summary</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
