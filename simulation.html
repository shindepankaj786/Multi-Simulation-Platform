<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornerstone | Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .sim-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 4rem);
        }

        .sim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .sim-title {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .sim-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 75%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .msg-user {
            align-self: flex-end;
            background: #2f2f2f;
            border: 1px solid var(--panel-border);
            border-bottom-right-radius: 4px;
        }

        .msg-system {
            align-self: center;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            box-shadow: none;
            font-style: italic;
        }

        .msg-facilitator {
            align-self: flex-start;
            background: transparent;
            border: none;
            box-shadow: none;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: #2f2f2f;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-area button {
            padding: 0 2rem;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-area button:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .input-area button:disabled, .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .options-area {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
        }
        
        .options-area button {
            padding: 1rem 1.25rem;
            background: #2f2f2f;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .options-area button:hover:not(:disabled) {
            background: #3f3f3f;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .options-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 24px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-container">
            <header class="sim-header">
                <h1 class="sim-title" id="sim-title">Loading Simulation...</h1>
                <div class="sim-meta">
                    <span id="turn-counter">Turn: 0/0</span>
                    <button class="btn-primary" id="exit-btn" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Exit</button>
                </div>
            </header>

            <main class="glass-panel chat-area">
                <div class="messages" id="messages">
                    <!-- Messages will appear here -->
                </div>
            </main>

            <div class="input-area" id="input-area">
                <input type="text" id="chat-input" placeholder="Type your response..." autocomplete="off" disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
            
            <div class="options-area" id="options-area">
                <button onclick="window.handleOption(1)">1 - Rarely</button>
                <button onclick="window.handleOption(2)">2 - Sometimes</button>
                <button onclick="window.handleOption(3)">3 - Often</button>
                <button onclick="window.handleOption(4)">4 - Almost Always</button>
            </div>
        </div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/simulation.js"></script>
</body>
</html>
